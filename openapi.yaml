        bankInstructions: {type: string, maxLength: 1000}
        shippingFee: {type: number, minimum: 0, maximum: 5000}
        googleAnalyticsMeasurementId: {type: string, maxLength: 24, pattern: '^(?:|G-[A-Z0-9]{4,20})$'}
    NewsletterInput:
